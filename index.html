<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mon Stock Alimentaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface2: #f7f8fa;
  --border: #e5e7eb;
  --primary: #2563eb;
  --primary-light: #dbeafe;
  --primary-dark: #1d4ed8;
  --reserve: #7c3aed;
  --reserve-light: #ede9fe;
  --danger: #dc2626;
  --danger-light: #fee2e2;
  --warning: #d97706;
  --warning-light: #fef3c7;
  --success: #16a34a;
  --success-light: #dcfce7;
  --text: #111827;
  --text2: #374151;
  --muted: #6b7280;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 6px rgba(0,0,0,.05), 0 10px 40px rgba(0,0,0,.1);
}

html { font-size: 16px; }

body {
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 40px;
}

/* ── LAYOUT ── */
.app {
  max-width: 560px;
  margin: 0 auto;
}

/* ── HEADER ── */
.header {
  text-align: center;
  padding: 24px 0 20px;
}
.header h1 {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -.5px;
}
.header h1 span { color: var(--primary); }
.header p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-bottom: 16px;
}

/* ── FORM ── */
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 6px;
}

.input-wrap {
  position: relative;
}
.input-wrap .spinner {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: none;
}
.input-wrap.loading .spinner { display: block; }

@keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

input[type="text"], input[type="number"], input[type="date"], select {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  background: var(--surface);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  -webkit-appearance: none;
  appearance: none;
}
input:focus, select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 90px;
  gap: 10px;
  margin-top: 10px;
}

.form-row-3 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 10px;
}

.field { margin-top: 10px; }
.field:first-child { margin-top: 0; }

/* ── BUTTONS ── */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px 16px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.98); }

.btn-primary {
  background: var(--primary);
  color: white;
}
.btn-primary:hover { background: var(--primary-dark); }

.btn-outline {
  background: transparent;
  color: var(--primary);
  border: 1.5px solid var(--primary);
}
.btn-outline:hover { background: var(--primary-light); }

.btn-sm {
  padding: 7px 12px;
  font-size: 13px;
  border-radius: 6px;
  width: auto;
  flex: 1;
}

.btn-danger-sm {
  background: var(--danger-light);
  color: var(--danger);
}
.btn-danger-sm:hover { background: #fecaca; }

.btn-ghost-sm {
  background: var(--surface2);
  color: var(--text2);
}
.btn-ghost-sm:hover { background: var(--border); }

.scan-btn {
  background: linear-gradient(135deg, #1e40af, #2563eb);
  color: white;
  box-shadow: 0 2px 8px rgba(37,99,235,.3);
}

/* ── SCANNER ── */
#scanner-wrap {
  display: none;
  margin-top: 14px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  position: relative;
  background: #000;
}
#scanner-wrap.active { display: block; }

#scanner-video {
  width: 100%;
  max-height: 260px;
  object-fit: cover;
  display: block;
}

.scanner-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.scanner-frame {
  width: 70%;
  height: 120px;
  border: 2px solid rgba(255,255,255,.7);
  border-radius: 8px;
  position: relative;
}
.scanner-frame::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--primary);
  animation: scan 1.8s ease-in-out infinite;
  box-shadow: 0 0 8px var(--primary);
}
@keyframes scan {
  0%,100% { top: 0; }
  50% { top: calc(100% - 2px); }
}

.scanner-hint {
  color: white;
  font-size: 12px;
  margin-top: 12px;
  text-shadow: 0 1px 3px rgba(0,0,0,.8);
}

.scanner-close {
  position: absolute;
  top: 10px; right: 10px;
  background: rgba(0,0,0,.5);
  color: white;
  border: none;
  border-radius: 50%;
  width: 34px; height: 34px;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: all;
}

/* ── TOASTS ── */
#toast-container {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  width: calc(100% - 32px);
  max-width: 400px;
  pointer-events: none;
}

.toast {
  background: var(--text);
  color: white;
  padding: 12px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: slideUp .25s ease;
  width: 100%;
  text-align: center;
}
.toast.success { background: var(--success); }
.toast.warning { background: var(--warning); }
.toast.error   { background: var(--danger);  }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── SECTION STOCK ── */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  margin-bottom: 8px;
}
.section-header:active { opacity: .85; }

.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 15px;
}

.section-badge {
  background: var(--primary-light);
  color: var(--primary);
  border-radius: 20px;
  padding: 2px 9px;
  font-size: 12px;
  font-weight: 700;
  font-family: 'DM Mono', monospace;
}
.section-badge.reserve { background: var(--reserve-light); color: var(--reserve); }

.chevron {
  color: var(--muted);
  font-size: 13px;
  transition: transform .2s;
}
.chevron.open { transform: rotate(180deg); }

.stock-list {
  display: none;
  list-style: none;
  margin-bottom: 8px;
}
.stock-list.open { display: block; }

/* ── ITEM CARD ── */
.item-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  border-left: 4px solid var(--primary);
  box-shadow: var(--shadow);
  transition: box-shadow .15s;
}
.item-card.reserve { border-left-color: var(--reserve); }
.item-card.expired { border-left-color: var(--danger); background: #fff8f8; }
.item-card.expiring { border-left-color: var(--warning); background: #fffbf0; }

.item-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.item-name {
  font-weight: 600;
  font-size: 15px;
  color: var(--text);
  word-break: break-word;
}
.item-qty {
  background: var(--primary-light);
  color: var(--primary);
  border-radius: 6px;
  padding: 2px 9px;
  font-size: 13px;
  font-weight: 700;
  font-family: 'DM Mono', monospace;
  white-space: nowrap;
  flex-shrink: 0;
}
.item-card.reserve .item-qty { background: var(--reserve-light); color: var(--reserve); }

.item-meta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.dlc-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  font-family: 'DM Mono', monospace;
}
.dlc-badge.ok { background: var(--success-light); color: var(--success); }
.dlc-badge.warn { background: var(--warning-light); color: var(--warning); }
.dlc-badge.exp { background: var(--danger-light); color: var(--danger); }

.item-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.empty-state {
  text-align: center;
  padding: 24px;
  color: var(--muted);
  font-size: 14px;
}
.empty-state .icon { font-size: 32px; margin-bottom: 8px; }

/* ── SEARCH ── */
.search-wrap {
  position: relative;
  margin-bottom: 12px;
}
.search-wrap input { padding-left: 38px; }
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  font-size: 16px;
}

/* ── STATS BAR ── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.stat-chip {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 12px;
  text-align: center;
  box-shadow: var(--shadow);
}
.stat-chip .val {
  font-size: 22px;
  font-weight: 700;
  font-family: 'DM Mono', monospace;
  color: var(--text);
}
.stat-chip .lbl {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.stat-chip.warn .val { color: var(--warning); }
.stat-chip.exp  .val { color: var(--danger); }

/* ── MODAL CONFIRM ── */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px;
  width: 100%;
  max-width: 340px;
  box-shadow: var(--shadow-lg);
}
.modal h3 { font-size: 17px; margin-bottom: 8px; }
.modal p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
.modal-actions { display: flex; gap: 10px; }

/* ── RESPONSIVE ── */
@media (max-width: 400px) {
  body { padding: 10px; padding-bottom: 40px; }
  .stats-bar { grid-template-columns: repeat(3,1fr); }
  .stat-chip .val { font-size: 18px; }
}
</style>
</head>

<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <h1>🥫 Mon <span>Stock</span></h1>
    <p>Données stockées localement sur votre appareil</p>
  </div>

  <!-- STATS -->
  <div class="stats-bar" id="stats-bar">
    <div class="stat-chip">
      <div class="val" id="stat-total">0</div>
      <div class="lbl">Articles</div>
    </div>
    <div class="stat-chip warn">
      <div class="val" id="stat-warn">0</div>
      <div class="lbl">Exp. bientôt</div>
    </div>
    <div class="stat-chip exp">
      <div class="val" id="stat-exp">0</div>
      <div class="lbl">Périmés</div>
    </div>
  </div>

  <!-- FORM CARD -->
  <div class="card">
    <button class="btn scan-btn" id="scan-btn" onclick="toggleScanner()">
      <span>📷</span> Scanner un code-barres
    </button>

    <!-- SCANNER -->
    <div id="scanner-wrap">
      <video id="scanner-video" playsinline autoplay muted></video>
      <div class="scanner-overlay">
        <div class="scanner-frame"></div>
        <div class="scanner-hint">Centrez le code-barres dans le cadre</div>
      </div>
      <button class="scanner-close" onclick="stopScanner()" title="Fermer">✕</button>
    </div>

    <div class="field">
      <label class="form-label" for="f-name">Nom du produit</label>
      <div class="input-wrap" id="name-wrap">
        <input type="text" id="f-name" placeholder="Ex: Lait demi-écrémé…" autocomplete="off">
        <div class="spinner"></div>
      </div>
    </div>

    <div class="form-row">
      <div>
        <label class="form-label" for="f-dlc">Date limite (DLC)</label>
        <input type="date" id="f-dlc">
      </div>
      <div>
        <label class="form-label" for="f-qty">Qté</label>
        <input type="number" id="f-qty" value="1" min="1" max="999" style="text-align:center">
      </div>
    </div>

    <div class="field">
      <label class="form-label" for="f-loc">Emplacement</label>
      <select id="f-loc">
        <option value="fridge">🧊 Frigo</option>
        <option value="reserve">📦 Réserve</option>
      </select>
    </div>

    <div class="field">
      <button class="btn btn-primary" onclick="addItem()">➕ Ajouter au stock</button>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="f-search" placeholder="Rechercher un produit…" oninput="render()">
  </div>

  <!-- FRIDGE -->
  <div class="section-header" onclick="toggleSection('fridge')">
    <div class="section-title">
      <span>🧊</span>
      <span>Frigo</span>
      <span class="section-badge" id="badge-fridge">0</span>
    </div>
    <span class="chevron open" id="chev-fridge">▼</span>
  </div>
  <ul class="stock-list open" id="list-fridge"></ul>

  <!-- RESERVE -->
  <div class="section-header" onclick="toggleSection('reserve')">
    <div class="section-title">
      <span>📦</span>
      <span>Réserve</span>
      <span class="section-badge reserve" id="badge-reserve">0</span>
    </div>
    <span class="chevron open" id="chev-reserve">▼</span>
  </div>
  <ul class="stock-list open" id="list-reserve"></ul>

</div><!-- /.app -->

<!-- MODAL CONFIRM -->
<div class="modal-backdrop" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <h3 id="modal-title">Confirmer</h3>
    <p id="modal-msg">Êtes-vous sûr ?</p>
    <div class="modal-actions">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Annuler</button>
      <button class="btn" id="modal-confirm" style="flex:1;background:var(--danger);color:white">Confirmer</button>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div id="toast-container"></div>

<script>
/* ════════════════════════════════════════════
   STORAGE
════════════════════════════════════════════ */
const KEY = "STOCK_APP_V2";

function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
  catch { return []; }
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); }
  catch { toast("Erreur de sauvegarde", "error"); }
}

let items = load();

/* ════════════════════════════════════════════
   TOAST
════════════════════════════════════════════ */
function toast(msg, type = "", duration = 2800) {
  const c = document.getElementById("toast-container");
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(() => el.remove(), 300); }, duration);
}

/* ════════════════════════════════════════════
   MODAL
════════════════════════════════════════════ */
let pendingAction = null;

function confirm(title, msg, action) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-msg").textContent = msg;
  pendingAction = action;
  document.getElementById("modal").classList.add("open");
}

function closeModal(e) {
  if (e && e.target !== document.getElementById("modal")) return;
  document.getElementById("modal").classList.remove("open");
  pendingAction = null;
}

document.getElementById("modal-confirm").onclick = () => {
  if (pendingAction) pendingAction();
  document.getElementById("modal").classList.remove("open");
  pendingAction = null;
};

/* ════════════════════════════════════════════
   DATE UTILS
════════════════════════════════════════════ */
function today() {
  const d = new Date();
  return d.toISOString().split("T")[0];
}

function daysUntil(dlc) {
  const now = new Date(); now.setHours(0,0,0,0);
  const end = new Date(dlc + "T00:00:00");
  return Math.round((end - now) / 86400000);
}

function dlcStatus(dlc) {
  const d = daysUntil(dlc);
  if (d < 0)  return { cls: "exp",  label: `Périmé (${Math.abs(d)}j)`,     icon: "⚠️" };
  if (d <= 3) return { cls: "warn", label: `Expire dans ${d}j`,             icon: "⏰" };
  return         { cls: "ok",   label: new Date(dlc+"T00:00:00").toLocaleDateString("fr-FR"), icon: "✅" };
}

function formatDlc(dlc) {
  const s = dlcStatus(dlc);
  return `<span class="dlc-badge ${s.cls}">${s.icon} ${s.label}</span>`;
}

/* ════════════════════════════════════════════
   ADD
════════════════════════════════════════════ */
function addItem() {
  const n = document.getElementById("f-name").value.trim();
  const d = document.getElementById("f-dlc").value;
  const q = parseInt(document.getElementById("f-qty").value, 10);
  const l = document.getElementById("f-loc").value;

  if (!n) { toast("Entrez un nom de produit", "warning"); document.getElementById("f-name").focus(); return; }
  if (!d) { toast("Entrez une date limite", "warning"); document.getElementById("f-dlc").focus(); return; }
  if (!q || q < 1) { toast("La quantité doit être ≥ 1", "warning"); return; }

  const existing = items.find(i => i.n === n && i.d === d && i.l === l);
  if (existing) {
    existing.q += q;
    toast(`+${q} ajouté à "${n}"`, "success");
  } else {
    items.push({ id: Date.now(), n, d, q, l });
    toast(`"${n}" ajouté au stock ✓`, "success");
  }

  save();
  render();
  document.getElementById("f-name").value = "";
  document.getElementById("f-qty").value = 1;
}

/* ════════════════════════════════════════════
   CONSUME / REMOVE
════════════════════════════════════════════ */
function consume(id) {
  const i = items.find(x => x.id === id);
  if (!i) return;
  i.q--;
  if (i.q <= 0) { items = items.filter(x => x.id !== id); toast(`"${i.n}" terminé 🎉`); }
  else toast(`1 "${i.n}" consommé`);
  save(); render();
}

function removeAll(id) {
  const i = items.find(x => x.id === id);
  if (!i) return;
  confirm("Retirer du stock", `Retirer tout le stock de "${i.n}" ?`, () => {
    items = items.filter(x => x.id !== id);
    save(); render();
    toast(`"${i.n}" retiré`, "success");
  });
}

/* ════════════════════════════════════════════
   TOGGLE SECTIONS
════════════════════════════════════════════ */
function toggleSection(loc) {
  const list = document.getElementById("list-" + loc);
  const chev = document.getElementById("chev-" + loc);
  const open = list.classList.toggle("open");
  chev.classList.toggle("open", open);
}

/* ════════════════════════════════════════════
   RENDER
════════════════════════════════════════════ */
function render() {
  const q = (document.getElementById("f-search").value || "").toLowerCase();
  const filtered = q ? items.filter(i => i.n.toLowerCase().includes(q)) : items;

  let total = 0, warn = 0, exp = 0;
  items.forEach(i => {
    total += i.q;
    const d = daysUntil(i.d);
    if (d < 0) exp++;
    else if (d <= 3) warn++;
  });
  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-warn").textContent  = warn;
  document.getElementById("stat-exp").textContent   = exp;

  ["fridge", "reserve"].forEach(loc => {
    const ul = document.getElementById("list-" + loc);
    const sub = filtered.filter(i => i.l === loc).sort((a,b) => a.d.localeCompare(b.d));
    document.getElementById("badge-" + loc).textContent = sub.reduce((s,i)=>s+i.q,0);

    if (!sub.length) {
      ul.innerHTML = `<div class="empty-state"><div class="icon">${loc==="fridge"?"🧊":"📦"}</div>${q?"Aucun résultat":"Aucun article"}</div>`;
      return;
    }

    ul.innerHTML = "";
    sub.forEach(i => {
      const d = daysUntil(i.d);
      const cls = d < 0 ? "expired" : d <= 3 ? "expiring" : "";
      const li = document.createElement("li");
      li.className = "item-card " + (loc === "reserve" ? "reserve " : "") + cls;
      li.innerHTML = `
        <div class="item-header">
          <span class="item-name">${escHtml(i.n)}</span>
          <span class="item-qty">× ${i.q}</span>
        </div>
        <div class="item-meta">${formatDlc(i.d)}</div>
        <div class="item-actions">
          <button class="btn btn-sm btn-ghost-sm" onclick="consume(${i.id})">➖ Consommer 1</button>
          <button class="btn btn-sm btn-danger-sm" onclick="removeAll(${i.id})">🗑 Retirer</button>
        </div>
      `;
      ul.appendChild(li);
    });
  });
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

render();

/* ════════════════════════════════════════════
   SCANNER (ZXing via CDN)
════════════════════════════════════════════ */
let scannerActive = false;
let codeReader = null;
let zxingLoaded = false;
let zxingLoading = false;

function loadZXing(cb) {
  if (zxingLoaded) { cb(); return; }
  if (zxingLoading) { setTimeout(() => loadZXing(cb), 200); return; }
  zxingLoading = true;
  const s = document.createElement("script");
  s.src = "https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js";
  s.onload = () => { zxingLoaded = true; cb(); };
  s.onerror = () => { zxingLoading = false; toast("Impossible de charger le scanner", "error"); };
  document.head.appendChild(s);
}

async function toggleScanner() {
  if (scannerActive) { stopScanner(); return; }

  // Check permissions politely
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast("Caméra non disponible sur ce navigateur", "error"); return;
  }

  document.getElementById("scan-btn").textContent = "⏳ Chargement…";
  document.getElementById("scan-btn").disabled = true;

  loadZXing(async () => {
    try {
      await startScanner();
    } catch(e) {
      document.getElementById("scan-btn").innerHTML = "<span>📷</span> Scanner un code-barres";
      document.getElementById("scan-btn").disabled = false;
      if (e.name === "NotAllowedError") toast("Permission caméra refusée", "error");
      else if (e.name === "NotFoundError") toast("Aucune caméra trouvée", "error");
      else toast("Erreur caméra : " + e.message, "error");
    }
  });
}

async function startScanner() {
  const wrap = document.getElementById("scanner-wrap");
  const video = document.getElementById("scanner-video");

  codeReader = new ZXing.BrowserMultiFormatReader();

  // Get back camera if available
  const devices = await ZXing.BrowserMultiFormatReader.listVideoInputDevices();
  const backCam = devices.find(d => /back|rear|environment/i.test(d.label)) || devices[devices.length - 1];
  const deviceId = backCam ? backCam.deviceId : undefined;

  wrap.classList.add("active");
  document.getElementById("scan-btn").innerHTML = "🔴 Arrêter le scanner";
  document.getElementById("scan-btn").disabled = false;
  scannerActive = true;

  codeReader.decodeFromVideoDevice(deviceId, video, (result, err) => {
    if (result) {
      const code = result.getText();
      stopScanner();
      lookupBarcode(code);
    }
  });
}

function stopScanner() {
  if (codeReader) {
    try { codeReader.reset(); } catch(e) {}
    codeReader = null;
  }
  document.getElementById("scanner-wrap").classList.remove("active");
  document.getElementById("scan-btn").innerHTML = "<span>📷</span> Scanner un code-barres";
  document.getElementById("scan-btn").disabled = false;
  scannerActive = false;
}

/* ════════════════════════════════════════════
   OPEN FOOD FACTS LOOKUP
════════════════════════════════════════════ */
async function lookupBarcode(code) {
  const wrap = document.getElementById("name-wrap");
  const input = document.getElementById("f-name");
  input.value = code;
  wrap.classList.add("loading");
  toast("🔍 Recherche du produit…");

  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`, { signal: AbortSignal.timeout(5000) });
    const data = await res.json();
    if (data.status === 1) {
      const p = data.product;
      const name = p.product_name_fr || p.product_name || p.generic_name_fr || p.generic_name || "";
      if (name) {
        input.value = name.charAt(0).toUpperCase() + name.slice(1);
        toast(`✅ Produit trouvé : ${input.value}`, "success");
      } else {
        toast("Produit trouvé, mais sans nom. Entrez-le manuellement.", "warning");
      }
    } else {
      toast("Produit inconnu — entrez le nom manuellement", "warning");
    }
  } catch(e) {
    if (e.name !== "AbortError") toast("Hors ligne — entrez le nom manuellement", "warning");
  } finally {
    wrap.classList.remove("loading");
    document.getElementById("f-dlc").focus();
  }
}

/* ════════════════════════════════════════════
   KEYBOARD SHORTCUTS
════════════════════════════════════════════ */
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.activeElement.id !== "f-search") addItem();
  if (e.key === "Escape") { stopScanner(); closeModal(); }
});

/* ════════════════════════════════════════════
   DEFAULT DATE = TODAY
════════════════════════════════════════════ */
document.getElementById("f-dlc").value = today();
