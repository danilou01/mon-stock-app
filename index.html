<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Stock Alimentaire</title>

<script src="https://cdn.jsdelivr.net/npm/quagga/dist/quagga.min.js"></script>

<style>
:root {
    --primary:#2563eb;
    --reserve:#6d28d9;
    --bg:#f3f4f6;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
}

/* ===== PAGE CENTRÉE ===== */
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    font-family: system-ui, sans-serif;
    overflow-y: auto;
}

/* ===== CONTENEUR ===== */
.container {
    width: 100%;
    max-width: 600px;
    background: white;
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.1);
}

/* ===== UI ===== */
h1 {
    text-align: center;
    color: var(--primary);
}

p.info {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
}

input, select, button {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    font-size: 16px;
}

input, select {
    border: 1px solid #d1d5db;
}

button {
    background: var(--primary);
    color: white;
    border: none;
    font-weight: 600;
    cursor: pointer;
}

/* ===== AJUSTEMENT LARGEURS ===== */
.input-name {
    max-width: 420px;   /* 👈 largeur maîtrisée */
    margin: 0 auto 12px auto;
    display: block;
}

.row {
    display: flex;
    justify-content: center;
    gap: 10px;
}

#dlc {
    max-width: 220px;
}

#qty {
    max-width: 80px;
    text-align: center;
}

/* ===== STOCK ===== */
.stock-section h2 {
    background: #f9fafb;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
}

.stock-list {
    display: none;
    list-style: none;
    padding: 0;
    margin-top: 10px;
}

.item-card {
    background: var(--card);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 10px;
    border-left: 5px solid var(--primary);
}

.item-card.reserve {
    border-left-color: var(--reserve);
}

.item-actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.item-actions button {
    flex: 1;
    font-size: 14px;
}

/* ===== SCANNER ===== */
#scanner {
    display: none;
    margin-bottom: 15px;
    border: 2px dashed #ccc;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>Mon Stock Alimentaire</h1>
<p class="info">Données stockées localement sur votre appareil</p>

<button onclick="toggleScanner()">📷 Scanner un produit</button>
<div id="scanner"></div>

<input id="name" class="input-name" placeholder="Nom du produit">

<div class="row">
    <input id="dlc" type="date">
    <input id="qty" type="number" value="1" min="1">
</div>

<select id="loc">
    <option value="fridge">Frigo</option>
    <option value="reserve">Réserve</option>
</select>

<button onclick="addItem()">➕ Ajouter au stock</button>

<div class="stock-section">
    <h2 onclick="toggle('fridge-list')">🧊 Frigo <span>▼</span></h2>
    <ul id="fridge-list" class="stock-list"></ul>
</div>

<div class="stock-section">
    <h2 onclick="toggle('reserve-list')">📦 Réserve <span>▼</span></h2>
    <ul id="reserve-list" class="stock-list"></ul>
</div>

</div>

<script>
const KEY = "STOCK_APP";
let items = JSON.parse(localStorage.getItem(KEY) || "[]");
let scanning = false;

function save() {
    localStorage.setItem(KEY, JSON.stringify(items));
}

function toggle(id) {
    const el = document.getElementById(id);
    el.style.display = el.style.display === "block" ? "none" : "block";
}

function addItem() {
    const n = name.value.trim();
    const d = dlc.value;
    const q = parseInt(qty.value, 10);
    const l = loc.value;
    if (!n || !d || q < 1) return;

    const existing = items.find(i => i.n === n && i.d === d && i.l === l);
    existing ? existing.q += q : items.push({id: Date.now(), n, d, q, l});

    save();
    render();
    name.value = "";
    qty.value = 1;
}

function consume(id) {
    const i = items.find(x => x.id === id);
    i.q--;
    if (i.q <= 0) items = items.filter(x => x.id !== id);
    save();
    render();
}

function removeAll(id) {
    if (!confirm("Retirer tout le stock ?")) return;
    items = items.filter(x => x.id !== id);
    save();
    render();
}

function render() {
    ["fridge", "reserve"].forEach(loc => {
        const ul = document.getElementById(loc + "-list");
        ul.innerHTML = "";
        items.filter(i => i.l === loc).forEach(i => {
            const li = document.createElement("li");
            li.className = "item-card " + (loc === "reserve" ? "reserve" : "");
            li.innerHTML = `
                <strong>${i.n}</strong><br>
                Quantité : ${i.q} | DLC : ${i.d}
                <div class="item-actions">
                    <button onclick="consume(${i.id})">➖ Consommer</button>
                    <button onclick="removeAll(${i.id})">🗑 Retirer</button>
                </div>
            `;
            ul.appendChild(li);
        });
    });
}
render();

/* ===== SCANNER ===== */
function toggleScanner() {
    const sc = document.getElementById("scanner");
    if (scanning) {
        Quagga.stop();
        sc.style.display = "none";
        scanning = false;
        return;
    }
    sc.style.display = "block";
    Quagga.init({
        inputStream: {
            type: "LiveStream",
            target: sc,
            constraints: { facingMode: "environment" }
        },
        decoder: { readers: ["ean_reader","ean_8_reader","code_128_reader"] }
    }, err => {
        if (err) return;
        Quagga.start();
        scanning = true;
    });
    Quagga.onDetected(d => {
        name.value = d.codeResult.code;
        Quagga.stop();
        sc.style.display = "none";
        scanning = false;
    });
}
</script>

</body>
</html>
